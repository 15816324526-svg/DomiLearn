[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "domilearn-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "docling==2.142.1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "onnxruntime==1.31.0",
  "psutil>=6,<8",
  "pydantic-settings>=2.7,<3",
  "pypdfium2>=5,<6",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "rapidocr>=3,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docling: slow local Docling integration test"]

[tool.setuptools.packages.find]
include = ["app*"]

